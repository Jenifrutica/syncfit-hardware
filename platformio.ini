; PlatformIO project configuration for SyncFit Edge (ESP32).
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; 3 MB application partition (the default 1.31 MB is too tight with TLS).
board_build.partitions = huge_app.csv
build_flags =
    -DSYNCFIT_FS_HZ=100
    -DSYNCFIT_PPG_SAMPLE_RATE_HZ=100
    -DSYNCFIT_PPG_WINDOW_SIZE=256
    -DSYNCFIT_TELEMETRY_PERIOD_MS=2560
    -DSYNCFIT_FORCE_PERIOD_MS=100
    -DSYNCFIT_TEMPERATURE_PERIOD_MS=1000
lib_deps =
    links2004/WebSockets@^2.6.0

; Full pipeline without sensors: synthetic PPG, temperature and force.
[env:esp32dev_mock]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DSYNCFIT_MOCK_SENSORS=1

; Host env for pure logic tests (no Arduino headers):
;   pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags =
    -DSYNCFIT_FS_HZ=100
    -DSYNCFIT_PPG_WINDOW_SIZE=256
    -DSYNCFIT_TELEMETRY_PERIOD_MS=2560
