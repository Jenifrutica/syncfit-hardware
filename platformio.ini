; PlatformIO project configuration for SyncFit Edge (ESP32).
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DSYNCFIT_FS_HZ=100
    -DSYNCFIT_WINDOW_SIZE=256

; Host env to run the unit tests without hardware:
;   pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -DSYNCFIT_FS_HZ=100 -DSYNCFIT_WINDOW_SIZE=256

; Sensors (uncomment when wiring is ready):
;   MAX30102  optical PPG (I2C, 100 Hz)
;   MLX90614  infrared thermal (I2C)
;   HX711     load cell + ADC (isometric dynamometry)
lib_deps =
    ; sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library
    ; wemos/MLX90614
    ; bogde/HX711
    ; bblanchon/ArduinoJson
    ; links2004/WebSockets
