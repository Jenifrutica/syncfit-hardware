name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native-tests:
    name: Host tests (pio test -e native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Run host tests
        run: pio test -e native
